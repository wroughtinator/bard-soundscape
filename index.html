<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Intentionally textless: a zero-width space keeps tabs and link previews blank
       instead of falling back to the URL or page text. -->
  <title>&#8203;</title>
  <meta name="theme-color" content="#070a18">
  <link rel="canonical" href="https://wroughtinator.github.io/bard-soundscape/">
  <!-- link preview: image only (Open Graph: Discord, iMessage, WhatsApp, Slack, Facebook, LinkedIn, Telegram, Signal) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wroughtinator.github.io/bard-soundscape/">
  <meta property="og:title" content="&#8203;">
  <meta property="og:image" content="https://wroughtinator.github.io/bard-soundscape/preview.jpg">
  <meta property="og:image:secure_url" content="https://wroughtinator.github.io/bard-soundscape/preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Golden meep trails and chime mandalas drifting over Bard">
  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="&#8203;">
  <meta name="twitter:image" content="https://wroughtinator.github.io/bard-soundscape/preview.jpg">
  <meta name="twitter:image:alt" content="Golden meep trails and chime mandalas drifting over Bard">
  <!-- Google / schema.org -->
  <meta itemprop="image" content="https://wroughtinator.github.io/bard-soundscape/preview.jpg">
  <link rel="image_src" href="https://wroughtinator.github.io/bard-soundscape/preview.jpg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <!--
    Bard — Endless Soundscape isn't endorsed by Riot Games and doesn't reflect the views or opinions of
    Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games,
    and all associated properties are trademarks or registered trademarks of Riot Games, Inc.
    Sounds and art © Riot Games. A free, non-commercial fan project.
  -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='22' fill='%23fff0cd'/><path d='M14 22a22 22 0 0 1 0 20' stroke='%23d6782f' stroke-width='5' fill='none'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="art" id="artA"></div>
  <div class="art" id="artB"></div>
  <div class="vignette"></div>
  <canvas id="sky"></canvas>

  <section id="intro" class="intro">
    <button id="begin" class="orb" disabled aria-label="Begin the soundscape" style="--p:0">
      <span class="stripe"></span>
    </button>
  </section>

  <footer id="hud-controls" class="hud controls hidden">
    <button id="pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" id="ico-pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg viewBox="0 0 24 24" id="ico-play" hidden><path d="M7 5l12 7-12 7z"/></svg>
    </button>
    <label class="vol">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </label>
    <button id="fs" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
